<app-auth-layout titulo="Recuperar contraseña" descripcion="Ingresa tu correo y te enviaremos un enlace para restablecerla">
  @if (solicitudEnviada()) {
    <div class="flex flex-col items-center gap-3 text-center">
      <span class="flex size-14 items-center justify-center rounded-full bg-success-soft text-success">
        <ui-icon name="circle-check-big" [size]="24" />
      </span>
      <p class="text-sm text-foreground">Si el correo está registrado, recibirás un enlace para restablecer tu contraseña.</p>
      <a routerLink="/auth/login" class="mt-2 text-sm font-medium text-primary hover:underline">Volver a iniciar sesión</a>
    </div>
  } @else {
    <form class="space-y-5" [formGroup]="form" (ngSubmit)="solicitar()">
      <ui-input label="Correo electrónico" type="email" icono="mail" placeholder="tu@correo.com" [control]="form.controls.email" [requerido]="true" />

      <ui-button type="submit" [cargando]="enviando()" [anchoCompleto]="true">
        Enviar enlace
        <ui-icon name="chevron-right" [size]="18" />
      </ui-button>

      <p class="text-center text-sm text-muted-foreground">
        <a routerLink="/auth/login" class="font-medium text-primary hover:underline">Volver a iniciar sesión</a>
      </p>
    </form>
  }
</app-auth-layout>
