<app-auth-layout titulo="Restablecer contraseña">
  @if (tokenAusente()) {
    <div class="flex flex-col items-center gap-3 text-center">
      <span class="flex size-14 items-center justify-center rounded-full bg-destructive-soft text-destructive">
        <ui-icon name="circle-alert" [size]="24" />
      </span>
      <p class="text-sm text-foreground">El enlace no es válido. Solicita uno nuevo.</p>
      <a routerLink="/auth/recuperar-password" class="mt-2 text-sm font-medium text-primary hover:underline">Solicitar enlace</a>
    </div>
  } @else if (restablecido()) {
    <div class="flex flex-col items-center gap-3 text-center">
      <span class="flex size-14 items-center justify-center rounded-full bg-success-soft text-success">
        <ui-icon name="circle-check-big" [size]="24" />
      </span>
      <p class="text-sm text-foreground">Tu contraseña fue restablecida. Ya puedes iniciar sesión con la nueva.</p>
      <a routerLink="/auth/login" class="mt-2 text-sm font-medium text-primary hover:underline">Ir a iniciar sesión</a>
    </div>
  } @else {
    <form class="space-y-5" [formGroup]="form" (ngSubmit)="restablecer()">
      <ui-input label="Nueva contraseña" type="password" icono="lock" placeholder="Mínimo 8 caracteres" [control]="form.controls.password" [requerido]="true" />
      <ui-input label="Confirmar contraseña" type="password" icono="lock" placeholder="Repite tu nueva contraseña" [control]="form.controls.confirmacion" [requerido]="true" />

      @if (errorGeneral()) {
        <p class="flex items-center gap-2 rounded-lg bg-destructive-soft px-3 py-2 text-sm text-destructive">
          <ui-icon name="circle-alert" [size]="16" clase="shrink-0" />
          {{ errorGeneral() }}
        </p>
      }

      <ui-button type="submit" [cargando]="enviando()" [anchoCompleto]="true">
        Restablecer contraseña
        <ui-icon name="chevron-right" [size]="18" />
      </ui-button>
    </form>
  }
</app-auth-layout>
