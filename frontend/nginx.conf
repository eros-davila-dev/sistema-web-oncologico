# Dos aplicaciones desde la misma imagen:
#   :80  portal del paciente (publico)
#   :81  intranet del personal (en produccion, exponerla solo en la red de la
#        fundacion o detras de una VPN / lista de IPs)
# Ambas reenvian /api al backend, asi el navegador nunca habla con otro origen.

map $sent_http_content_type $cache_estaticos {
    default                     "no-cache";
    ~*application/javascript    "public, max-age=31536000, immutable";
    ~*text/css                  "public, max-age=31536000, immutable";
    ~*image/                    "public, max-age=604800";
    ~*font/                     "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html/portal;
    index index.html;
    include /etc/nginx/snippets/comun.conf;
}

server {
    listen 81;
    server_name _;
    root /usr/share/nginx/html/intranet;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/snippets/comun.conf;
}
