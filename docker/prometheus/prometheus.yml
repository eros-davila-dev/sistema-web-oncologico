# Prometheus (perfil "monitoreo" de docker-compose.prod.yml). Lee el actuator
# del backend por el puerto interno 9091, que no se publica.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: oncologia-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:9091"]
