# Produccion: se aplica ENCIMA de docker-compose.yml.
#
#   cp .env.prod.example .env      # y completar los valores
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Diferencias con desarrollo:
# - Caddy es lo unico expuesto (80/443) y obtiene los certificados TLS solo.
#   Tres dominios: portal del paciente, intranet del personal y n8n (Telegram
#   solo entrega webhooks por HTTPS).
# - Ningun otro puerto se publica: PostgreSQL, Redis, backend y n8n solo son
#   alcanzables dentro de la red de Docker.
# - Las variables criticas son obligatorias (${VAR:?...}): sin ellas el
#   despliegue no arranca, en vez de arrancar con un secreto de ejemplo.
# - Respaldo diario de PostgreSQL con retencion (ver docs/OPERACION.md).
# - Prometheus opcional: --profile monitoreo.
#
# Requiere Docker Compose 2.24+ (por "!reset").

x-limite-logs: &limite-logs
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    <<: *limite-logs
    depends_on:
      - frontend
      - n8n
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Defina ACME_EMAIL (aviso de vencimiento de certificados)}
      DOMINIO_PORTAL: ${DOMINIO_PORTAL:?Defina DOMINIO_PORTAL, p. ej. portal.fundacion.pe}
      DOMINIO_INTRANET: ${DOMINIO_INTRANET:?Defina DOMINIO_INTRANET, p. ej. intranet.fundacion.pe}
      DOMINIO_N8N: ${DOMINIO_N8N:?Defina DOMINIO_N8N, p. ej. n8n.fundacion.pe}
      # Redes desde las que se permite la intranet y el editor de n8n (CIDR
      # separados por espacio). Por defecto, solo redes privadas: ajustar a la
      # IP publica de la fundacion o a la VPN.
      INTRANET_IPS_PERMITIDAS: ${INTRANET_IPS_PERMITIDAS:-private_ranges}
      N8N_IPS_EDITOR: ${N8N_IPS_EDITOR:-private_ranges}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  postgres:
    <<: *limite-logs
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}

  redis:
    <<: *limite-logs
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Defina REDIS_PASSWORD}", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  backend:
    <<: *limite-logs
    ports: !reset []
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET (minimo 32 caracteres aleatorios)}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:?Defina N8N_WEBHOOK_SECRET}
      CORS_ALLOWED_ORIGINS: https://${DOMINIO_PORTAL},https://${DOMINIO_INTRANET}
      FRONTEND_BASE_URL: https://${DOMINIO_PORTAL}
      FRONTEND_INTRANET_URL: https://${DOMINIO_INTRANET}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RATE_LIMIT_ALMACEN: redis
      MANAGEMENT_PORT: 9091
      # Solo se usa si el administrador aun tiene la contrasena de la semilla;
      # sin ella (y con la semilla activa) el backend no arranca en prod.
      ADMIN_PASSWORD_INICIAL: ${ADMIN_PASSWORD_INICIAL:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9091/actuator/health | grep -q UP"]
    deploy:
      resources:
        limits:
          memory: 1g

  frontend:
    <<: *limite-logs
    ports: !reset []
    build:
      context: ./frontend
      args:
        PORTAL_URL: https://${DOMINIO_PORTAL}
        INTRANET_URL: https://${DOMINIO_INTRANET}

  n8n:
    <<: *limite-logs
    ports: !reset []
    environment:
      N8N_HOST: ${DOMINIO_N8N}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${DOMINIO_N8N}/
      N8N_PROXY_HOPS: 1
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Defina N8N_ENCRYPTION_KEY, estable, no cambiarla despues}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
      PORTAL_BASE_URL: https://${DOMINIO_PORTAL}

  # Respaldo diario (pg_dump) de las bases "oncologia" y "n8n" con retencion
  # 7 dias / 4 semanas / 6 meses en ./respaldos. Copiar esa carpeta fuera del
  # servidor (ver docs/OPERACION.md): un respaldo en el mismo disco no
  # protege de la perdida del servidor.
  respaldo:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    <<: *limite-logs
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: America/Lima
      POSTGRES_HOST: postgres
      POSTGRES_DB: oncologia,n8n
      POSTGRES_USER: oncologia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_EXTRA_OPTS: "--clean --if-exists --no-owner"
      SCHEDULE: "0 3 * * *"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 8080
    volumes:
      - ./respaldos:/backups

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoreo"]
    restart: unless-stopped
    <<: *limite-logs
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
    volumes:
      - ./docker/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    # Sin puerto publicado: consultar con un tunel SSH
    # (ssh -L 9090:localhost:9090 servidor y "ports: 127.0.0.1:9090:9090").

volumes:
  caddy_data:
  caddy_config:
  prometheus_data:
