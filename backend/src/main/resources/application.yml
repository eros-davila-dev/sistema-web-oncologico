spring:
  application:
    name: oncologia
  http:
    client:
      # Ninguna llamada saliente (n8n, Gemini) puede colgar una peticion ni
      # una transaccion indefinidamente si el servicio externo no responde;
      # aplica a todos los RestClient.Builder autoconfigurados (Spring Boot
      # 3.4+, seccion 15: "nunca fallar en silencio", pero tampoco colgarse).
      connect-timeout: 5s
      read-timeout: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oncologia}
    username: ${DB_USUARIO:oncologia}
    password: ${DB_PASSWORD:oncologia}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

  # SMTP: solo se usa si MAIL_FLAG_SMTP=true (respaldo de la API de correo).
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  # Redis solo se usa si app.rate-limit.almacen=redis (produccion); la
  # conexion es perezosa, asi que en desarrollo no hace falta levantarlo.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:8080}

app:
  correo:
    # Remitente de los correos del sistema.
    remitente: ${MAIL_FROM_EMAIL:${MAIL_USERNAME:}}
    nombre-remitente: ${MAIL_FROM_NAME:Fundacion Oncologica Three Partners}
    # Logo de la cabecera: debe ser una URL PUBLICA (el cliente de correo la descarga).
    # Por defecto, el que sirve el portal; en local (localhost) no se vera en una bandeja real.
    logo-url: ${MAIL_LOGO_URL:${app.frontend.base-url}/logo-correo.png}
    # Proveedor principal: API HTTP de correo (servicemail / Quipu).
    api:
      habilitado: ${MAIL_FLAG_QUIPU:false}
      url: ${MAIL_API_URL:}
      clave: ${MAIL_API_KEY:}
    # Respaldo: SMTP (spring.mail.*). Si ambos estan activos se intenta la API y luego SMTP.
    smtp:
      habilitado: ${MAIL_FLAG_SMTP:false}
  rate-limit:
    # memoria (una instancia, desarrollo) o redis (produccion / varias instancias).
    almacen: ${RATE_LIMIT_ALMACEN:memoria}
  seguridad:
    # Ver ProtegerPasswordSemillaUseCase; el perfil prod exige el cambio.
    admin-password-inicial: ${ADMIN_PASSWORD_INICIAL:}
    exigir-cambio-password-semilla: ${EXIGIR_CAMBIO_PASSWORD_SEMILLA:false}
  outbox:
    intervalo: ${OUTBOX_INTERVALO:PT5S}
  jobs:
    # Jobs programados con ShedLock (SchedulingConfig). En false no se
    # registra ningun @Scheduled (util en tests de integracion).
    habilitados: ${JOBS_HABILITADOS:true}
  telegram:
    # Usuario publico del bot (sin @), para el enlace t.me/<bot>?start=<token>.
    # El TOKEN del bot NO va aqui: vive solo en las credenciales de n8n.
    bot-username: ${TELEGRAM_BOT_USERNAME:}
    minutos-validez-enlace: ${TELEGRAM_MINUTOS_VALIDEZ_ENLACE:30}
  recordatorios:
    # Frecuencia con que se programan los recordatorios de las citas proximas.
    cron: ${RECORDATORIOS_CRON:0 2/15 * * * *}
  agenda:
    # Horas despues de la cita en que, si nadie registro el desenlace, se
    # marca NO_ASISTIO automaticamente (indicador TNS; corregible con motivo).
    horas-cierre-automatico: ${AGENDA_HORAS_CIERRE_AUTOMATICO:48}
  estudio:
    # Una sesion de medicion del TPR abierta y no guardada en este tiempo se
    # marca ABANDONADA y queda fuera del promedio.
    minutos-maximos-registro: ${ESTUDIO_MINUTOS_MAXIMOS_REGISTRO:60}
  jwt:
    secret: ${JWT_SECRET:cambia-este-secreto-en-produccion-minimo-32-caracteres}
    access-token-minutos: ${JWT_ACCESS_MINUTOS:15}
    refresh-token-dias: ${JWT_REFRESH_DIAS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
    # Intranet del personal: destino de los enlaces de correo de cuentas que no son de paciente.
    intranet-url: ${FRONTEND_INTRANET_URL:http://localhost:4300}
  registro:
    # En false por defecto: activar solo cuando el envio real de correo
    # (SMTP/n8n) este configurado, para no dejar cuentas huerfanas sin forma
    # de verificarse (seccion 7).
    pacientes-habilitado: ${REGISTRO_PACIENTES_HABILITADO:false}
  webhook:
    n8n-secret: ${N8N_WEBHOOK_SECRET:cambia-este-secreto-de-webhook}
  n8n:
    base-url: ${N8N_BASE_URL:http://localhost:5678}
    webhook-secret: ${N8N_WEBHOOK_SECRET:cambia-este-secreto-de-webhook}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.6-flash}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  device:
    mqtt:
      enabled: ${MQTT_ENABLED:false}
      broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
      client-id: ${MQTT_CLIENT_ID:oncologia-backend}
      topic: ${MQTT_TOPIC:oncologia/dispositivos/+/lecturas}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  health:
    # El chequeo de salud de correo abre una conexion SMTP en cada consulta: no aporta y puede marcar caido al backend.
    mail:
      enabled: false
    redis:
      # Con el almacen en memoria, un Redis apagado no debe marcar el backend como caido.
      enabled: ${REDIS_HEALTH_HABILITADO:false}
  # En produccion el actuator escucha en un puerto interno que no se publica
  # (MANAGEMENT_PORT); el proxy solo enruta /api, nunca /actuator.
  server:
    port: ${MANAGEMENT_PORT:${server.port}}
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: oncologia

logging:
  level:
    com.threepartners.oncologia: ${LOG_LEVEL:INFO}
